name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          TG_BOT_TOKEN: test-token
          TG_ADMIN_CHAT_ID: '1'
          DB_PATH: /tmp/hyperliquid-monitor-tests.db
          RUN_DB_TESTS: '1'
        run: python -m unittest discover -s tests -v

  check-changes:
    runs-on: ubuntu-latest
    outputs:
      critical_files: ${{ steps.filter.outputs.critical_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for critical file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            critical_files:
              - 'Dockerfile'
              - 'requirements.txt'
              - 'main.py'
              - 'core/**'
              - 'infrastructure/**'
              - 'services/**'
              - 'tg_bot/**'

  build-and-push:
    needs: [check-changes, test]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref_type == 'tag' ||
      needs.check-changes.outputs.critical_files == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: yushum/hyperliquid-monitor
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
